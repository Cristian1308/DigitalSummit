<script>
    function hideWazeButtonOnDesktop() {
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        const wazeButton = document.getElementById('wazeButton');
        
        // Oculta el botón de Waze si no es un dispositivo móvil
        if (!isMobile) {
            wazeButton.style.display = 'none';
        }
    }


</script>
