    <!-- Contenedor del boleto -->

    <div class="ticket-container" id="ticketContainer">
      <button class="close-btn" id="closeBtn">&times;</button>
      <div id="ticket" class="ticket">
        <img id="qrCode" class="qr-code" src="" alt="Código QR">
      </div>

      <!-- Botones de acciones del boleto -->
      <div class="ticket-actions">
        <button id="downloadBtn" class="btn-small">Descargar</button>
      </div>

      <button id="sendBtn" class="btn-send" style="display: none;">Enviar</button>
    </div>

    <div id="emailNotFoundModalUnique" class="modal-unique">

        <p>Por favor, verifica tu correo o elige una de las siguientes opciones:</p>
        <div class="modal-buttons-unique">
          <button onclick="hablarConSoporteUnique()">Hablar con soporte</button>
          <button onclick="realizarCompraUnique()">Realizar la compra</button>
        </div>
